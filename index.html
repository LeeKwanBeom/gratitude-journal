<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>감사일기</title>
<style>
  :root{
    --bg:#fbfaf8;
    --ink:#2b2b28;
    --sub:#8a8578;
    --line:#e8e4dc;
    --accent:#a97155;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    line-height:1.7;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:56px 24px 120px;
  }
  header{
    margin-bottom:48px;
  }
  header h1{
    font-size:22px;
    font-weight:600;
    margin:0 0 6px;
    letter-spacing:-0.02em;
  }
  header p{
    margin:0;
    font-size:14px;
    color:var(--sub);
  }
  .stats{
    display:flex;
    gap:20px;
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid var(--line);
  }
  .stat{
    font-size:13px;
    color:var(--sub);
  }
  .stat b{
    display:block;
    font-size:20px;
    color:var(--ink);
    font-weight:600;
    margin-bottom:2px;
  }
  .entry{
    padding:28px 0;
    border-bottom:1px solid var(--line);
  }
  .entry:first-of-type{
    padding-top:0;
  }
  .entry-date{
    font-size:13px;
    color:var(--accent);
    font-weight:600;
    margin-bottom:12px;
    letter-spacing:0.02em;
  }
  .row{
    margin-bottom:10px;
    font-size:15px;
  }
  .row:last-child{
    margin-bottom:0;
  }
  .label{
    display:inline-block;
    font-size:11px;
    color:var(--sub);
    margin-bottom:3px;
  }
  .text{
    display:block;
    color:var(--ink);
  }
  .thanks{
    color:var(--accent);
    font-weight:600;
  }
  .empty{
    color:var(--sub);
    font-size:14px;
    padding:40px 0;
    text-align:center;
  }
  footer{
    margin-top:60px;
    text-align:center;
    font-size:12px;
    color:var(--sub);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>감사일기</h1>
      <p>그날의 일 · 그 일이 나에게 준 의미 · 그로 인해 감사한 사람</p>
      <div class="stats">
        <div class="stat"><b id="statCount">0</b>기록한 날</div>
        <div class="stat"><b id="statStreak">0</b>최근 연속 기록</div>
      </div>
    </header>

    <div id="list"></div>

    <footer>gratitude-journal · 이관범</footer>
  </div>

<script>
async function load(){
  const res = await fetch('entries.json?t=' + Date.now());
  const data = await res.json();
  render(data);
}

function render(data){
  const listEl = document.getElementById('list');
  const sorted = [...data].sort((a,b) => b.date.localeCompare(a.date));

  document.getElementById('statCount').textContent = sorted.length;
  document.getElementById('statStreak').textContent = calcStreak(sorted);

  if(sorted.length === 0){
    listEl.innerHTML = '<div class="empty">아직 기록된 감사일기가 없습니다.</div>';
    return;
  }

  listEl.innerHTML = sorted.map(e => `
    <div class="entry">
      <div class="entry-date">${formatDate(e.date)}</div>
      <div class="row">
        <span class="label">있었던 일</span>
        <span class="text">${escapeHtml(e.event)}</span>
      </div>
      <div class="row">
        <span class="label">그게 나에게 의미 있었던 이유</span>
        <span class="text">${escapeHtml(e.meaning)}</span>
      </div>
      <div class="row">
        <span class="label">감사한 사람</span>
        <span class="text thanks">${escapeHtml(e.thanks_to)}</span>
      </div>
    </div>
  `).join('');
}

function calcStreak(sortedDesc){
  if(sortedDesc.length === 0) return 0;
  let streak = 1;
  for(let i=0;i<sortedDesc.length-1;i++){
    const cur = new Date(sortedDesc[i].date);
    const next = new Date(sortedDesc[i+1].date);
    const diffDays = Math.round((cur - next) / 86400000);
    if(diffDays === 1){ streak++; } else { break; }
  }
  return streak;
}

function formatDate(dstr){
  const d = new Date(dstr);
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${days[d.getDay()]})`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

load();
</script>
</body>
</html>
